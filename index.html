<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bethel Radon Root Cause Investigation</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <h1>Bethel Analytics <span>Radon Root Cause Investigation</span></h1>
            </div>
            <nav>
                <a href="index.html" class="active">Graphs (30)</a>
                <a href="health.html">App Health</a>
                <a href="about.html">About & Info</a>
            </nav>
        </header>

        <div class="workspace">
            <div class="controls-bar">
                <div class="control-group">
                    <label for="graphSelect">Analytical Model:</label>
                    <select id="graphSelect" onchange="switchGraph(this.value)"></select>
                </div>
                
                <div class="control-group time-controls">
                    <label>Set Time Range:</label>
                    <button onclick="setTimeRange('week')">1 Week</button>
                    <button onclick="setTimeRange('month')" class="active">1 Month</button>
                    <button onclick="setTimeRange('3months')">3 Months</button>
                    <button onclick="setTimeRange('all')">All Time</button>
                </div>
            </div>

            <div class="chart-layout-wrapper">
                <button class="nav-arrow left-arrow" onclick="stepTime(-1)" title="Previous Timeframe">&#9664;</button>
                
                <div class="chart-viewport">
                    <canvas id="investigationChart"></canvas>
                </div>
                
                <button class="nav-arrow right-arrow" onclick="stepTime(1)" title="Next Timeframe">&#9654;</button>
            </div>
        </div>
    </div>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/graphs.js"></script>
</body>
</html>
