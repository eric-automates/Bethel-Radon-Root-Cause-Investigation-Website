<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Bethel Radon Root Cause Investigation</title>
    <!-- Version 2.0 triggers a hard cache reset -->
    <link rel="stylesheet" href="assets/css/main.css?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark-theme">
    <div class="app-layout">
        
        <!-- Standardized Header -->
        <header class="app-header">
            <div class="brand">
                <h1>Bethel Analytics <span class="subtitle">Root Cause Investigation</span></h1>
            </div>
            <nav class="app-nav">
                <a href="index.html" class="active">Dashboard</a>
                <a href="health.html">System Health</a>
                <a href="about.html">About & Info</a>
            </nav>
        </header>

        <!-- Grouped Control Toolbar -->
        <div class="app-toolbar">
            <!-- Model Selection Group -->
            <div class="toolbar-section">
                <span class="toolbar-label">Analytical Model</span>
                <div class="control-group">
                    <button class="icon-btn" onclick="cycleModel(-1)" title="Previous Model">&#8592;</button>
                    <select id="graphSelect" class="data-select" onchange="switchGraph(this.value)"></select>
                    <button class="icon-btn" onclick="cycleModel(1)" title="Next Model">&#8594;</button>
                </div>
            </div>
            
            <!-- Time Navigation Group -->
            <div class="toolbar-section">
                <span class="toolbar-label">Time Range Selection</span>
                <div class="control-group">
                    <button class="icon-btn" onclick="stepTime(-1)" title="Step Back in Time">&#9664;</button>
                    <div class="time-tabs">
                        <button class="time-btn" onclick="setTimeRange('week')">1W</button>
                        <button class="time-btn active" onclick="setTimeRange('month')">1M</button>
                        <button class="time-btn" onclick="setTimeRange('3months')">3M</button>
                        <button class="time-btn" onclick="setTimeRange('all')">ALL</button>
                    </div>
                    <button class="icon-btn" onclick="stepTime(1)" title="Step Forward in Time">&#9654;</button>
                </div>
            </div>
        </div>

        <!-- 100% Fluid Chart Area -->
        <main class="app-main">
            <div class="chart-container">
                <div class="portrait-overlay">Rotate device for optimal widescreen viewing &#10227;</div>
                <canvas id="investigationChart"></canvas>
            </div>
        </main>
        
    </div>

    <!-- Version 2.0 Scripts -->
    <script src="assets/js/app.js?v=2.0"></script>
    <script src="assets/js/graphs.js?v=2.0"></script>
</body>
</html>
